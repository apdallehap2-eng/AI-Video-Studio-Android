name: Build AI Video Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/ai_video_project
          echo "" | base64 -d > /tmp/ai_video_project/project.zip
          unzip -q /tmp/ai_video_project/project.zip -d /tmp/ai_video_project/unpacked
          ROOT=$(find /tmp/ai_video_project/unpacked -maxdepth 1 -mindepth 1 -type d | head -n 1)
          echo "Project root: $ROOT"
          test -d "$ROOT/app"
          test -f "$ROOT/gradlew"
          chmod +x "$ROOT/gradlew"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Copy APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk" artifacts/AI_Video_Studio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-APK
          path: artifacts/AI_Video_Studio.apk
